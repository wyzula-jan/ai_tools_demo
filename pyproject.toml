[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-tools-demo"
version = "0.1.0"
description = "Simple Qt-based user database demo built with AI assistance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AI Tools Demo Team" }
]
dependencies = [
  "qtpy>=2.4",
  "PySide6>=6.5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-qt>=4.3",
]

[project.urls]
Repository = "https://example.com/ai-tools-demo"
